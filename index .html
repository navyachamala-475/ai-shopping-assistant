<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Shopping Assistant</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: #fff;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #1a1a2e;
    color: #fff;
    padding: 18px 16px;
  }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 13px; color: #b8b8c8; }
  #chat {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .user {
    align-self: flex-end;
    background: #1a1a2e;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bot {
    align-self: flex-start;
    background: #eef0f4;
    color: #1a1a2e;
    border-bottom-left-radius: 4px;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #e2e2e8;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border-radius: 20px;
    border: 1px solid #d5d5dd;
    font-size: 14px;
    outline: none;
  }
  button {
    background: #1a1a2e;
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>AI Shopping Assistant</h1>
    <p>Ask me what you're looking for — I'll find the best match.</p>
  </header>
  <div id="chat"></div>
  <form id="chat-form">
    <input type="text" id="user-input" placeholder="e.g. running shoes under 3000 for flat feet" autocomplete="off" />
    <button type="submit">Send</button>
  </form>
</div>

<script src="products.js"></script>
<script src="assistant.js"></script>
</body>
</html>
